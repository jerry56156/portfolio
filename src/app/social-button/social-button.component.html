<button
  type="button"
  class="social-btn"
  (click)="open()"
  [style.--icon-size.px]="size()"
  [class.is-linkedin]="kind() === 'linkedin'"
  [class.is-github]="kind() === 'github'"
>
  <span class="lead">=&gt;</span>

  <span class="content">
    <lucide-icon class="lucide" [img]="icon()" [size]="size()"></lucide-icon>
    <span class="label">{{ label() }}</span>
  </span>
</button>
