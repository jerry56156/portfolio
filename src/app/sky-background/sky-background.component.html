<div class="wrap" [attr.data-mode]="mode()">
  <!-- Both stills stay mounted; only visibility toggles, so there's never an src swap. -->
  <img
    class="still-layer"
    [class.hidden]="!showDayStill()"
    [src]="assets.stillDay"
    aria-hidden="true"
  />
  <img
    class="still-layer"
    [class.hidden]="showDayStill()"
    [src]="assets.stillNight"
    aria-hidden="true"
  />
  <video
    #d2nVid
    class="video-layer"
    [class.active]="activeVideo() === 'd2n'"
    [src]="assets.d2n"
    muted
    playsinline
    preload="auto"
    (ended)="onEnded('d2n')"
    aria-hidden="true"
  ></video>
  <video
    #n2dVid
    class="video-layer"
    [class.active]="activeVideo() === 'n2d'"
    [src]="assets.n2d"
    muted
    playsinline
    preload="auto"
    (ended)="onEnded('n2d')"
    aria-hidden="true"
  ></video>
</div>
