@if (!loading() && track(); as t) {
  <button type="button" class="social-btn" (click)="open()">
    <span class="lead">=&gt;</span>
    <span class="content">
      <lucide-icon class="disc" [img]="discIcon" [size]="22"></lucide-icon>
      <span class="label">Last listened to: <strong>{{ t.title }}</strong> by {{ t.artist }}</span>
    </span>
  </button>
}
