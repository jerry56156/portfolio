<section class="section">
  <div class="container">
    <h2 class="section-label">// Skills</h2>

    @for (group of groups; track group.label) {
      <div class="group">
        <p class="group-label">{{ group.label }}</p>
        <div class="tags">
          @for (skill of group.items; track skill) {
            <span class="tag">{{ skill }}</span>
          }
        </div>
      </div>
    }
  </div>
</section>
