<section class="section">
  <div class="container">
    <p class="section-label">
      <span class="kw">const </span><span class="var">skills </span><span class="op">= &#123;</span>
    </p>

    @for (category of categories; track category.name) {
      <div class="category">
        <p class="category-label">
          <span class="str">"{{ category.name }}"</span><span class="op">: [</span>
        </p>
        <div class="tags">
          @for (skill of category.items; track skill) {
            <span class="tag">{{ skill }}</span>
          }
        </div>
        <p class="close-bracket"><span class="op">]</span></p>
      </div>
    }

    <p class="section-label"><span class="op">&#125;</span></p>
  </div>
</section>
